name: YouTube Auto Views Bot

on:
  schedule:
    # هر ساعت دقیقاً در دقیقه ۰ اجرا می‌شود
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-views:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # ← اضافه شد
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run YouTube Views Script
        env:
          PYTHONPATH: .
        run: |
          echo "شروع بازدید از ویدیوها..."
          python main.py
          echo "فرآیند بازدید تمام شد."
